name: DEADLINE SEOUL matched-camera comparison
on:
  push:
    branches: [fix/stability-visuals-20261113]
    paths: [qa/compare-run.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both versions
        run: |
          npm ci --ignore-scripts --no-audit
          npm install --no-save playwright@1.56.1 --ignore-scripts --no-audit
          npx playwright install --with-deps chromium
          npm run build
          node scripts/coop-dev-server.mjs > /tmp/new-game.log 2>&1 &
          git worktree add --detach /tmp/deadline-baseline 7579315c24bf2318fb8aa6235585c926f2fa2592
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/deadline-baseline/node_modules
          cd /tmp/deadline-baseline
          npm run build
          PORT=4174 node scripts/coop-dev-server.mjs > /tmp/baseline.log 2>&1 &
      - name: Same actual camera in both rendered frames
        run: node scripts/browser-compare.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadline-seoul-matched-camera
          path: browser-qa/
