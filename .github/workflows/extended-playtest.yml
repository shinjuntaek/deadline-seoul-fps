name: DEADLINE SEOUL 15-minute playtest
on:
  push:
    branches: [fix/stability-visuals-20261113]
    paths: [qa/soak-run.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deadline-extended-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sustained-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and install browser
        run: |
          npm ci --ignore-scripts --no-audit
          npm install --no-save playwright@1.56.1 --ignore-scripts --no-audit
          npx playwright install --with-deps chromium
          npm run build
      - name: Start isolated server
        run: |
          node scripts/coop-dev-server.mjs > /tmp/coop.log 2>&1 &
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Build the previous public version in an isolated worktree
        run: |
          git worktree add --detach /tmp/deadline-baseline 7579315c24bf2318fb8aa6235585c926f2fa2592
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/deadline-baseline/node_modules
          cd /tmp/deadline-baseline
          npm run build
          PORT=4174 node scripts/coop-dev-server.mjs > /tmp/baseline.log 2>&1 &
      - name: Identical-camera render comparison
        run: node scripts/browser-compare.cjs
      - name: Fifteen minutes of automated live combat
        env:
          QA_SOAK_SECONDS: '900'
        run: node scripts/browser-soak.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadline-seoul-15min-evidence
          path: browser-qa/
